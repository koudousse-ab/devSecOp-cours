name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Docker Image
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f Dockerfile
          test -f html/index.html
          test -f html/style.css
          test -f html/script.js

      - name: Build Docker image
        run: |
          docker build -t mon-nginx:ci .
